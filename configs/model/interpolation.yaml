_target_: srnet.models.sr_net_module.SRNetModule

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.0005
  weight_decay: 0.0

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.1
  patience: 10

net:
  _target_: srnet.models.components.sr_dense_net.InterpolationNet
  scale_factor: 4
  interpolation: area

# compile model for faster training with pytorch 2.0
compile: false
